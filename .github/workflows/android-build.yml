name: ROMITUBE Android Debug Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      - name: Verify build environment
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed | grep -E 'platforms;android-36|build-tools;36' || true

      - name: Build Debug APK
        run: gradle --no-daemon --stacktrace --console=plain :app:assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v5
        with:
          name: ROMITUBE-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ROMITUBE-debug-test-reports-${{ github.sha }}
          path: |
            app/build/test-results/**/*.xml
            app/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7
